<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
</head>

<body>

    <h1>Create Blog</h1>

    <form method="POST"
          action="{{ url_for('blog.generate_blog') }}"
          enctype="multipart/form-data">

        {{ form.hidden_tag() }}

        <div>
            {{ form.photo.label }}
            {{ form.photo() }}
        </div>

        <button type="submit">
            Generate Blog
        </button>

    </form>

    <br>

    <a href="{{ url_for('main.dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
